name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/deploy_first_test
      ENVIRONMENT: test

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deploy_first_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d deploy_first_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -v
